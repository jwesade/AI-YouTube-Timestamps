[project]
name = "padel-atlas-ingest"
version = "0.1.0"
description = "Data ingest pipeline for padel-atlas-de: scrapes padel courts from public sources and normalises them."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "typer>=0.12",
    "python-slugify>=8.0",
]

[project.optional-dependencies]
db = [
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
ingest = "ingest.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingest"]

[tool.ruff]
line-length = 100
target-version = "py311"
